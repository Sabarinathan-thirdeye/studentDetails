<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" class="form-control" [(ngModel)]="user.firstName" name="firstName" required />
      <div *ngIf="registerForm.controls['firstName']?.invalid && registerForm.controls['firstName']?.touched" class="invalid-feedback">
        Please enter your first name.
      </div>
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" class="form-control" [(ngModel)]="user.lastName" name="lastName" required />
      <div *ngIf="registerForm.controls['lastName']?.invalid && registerForm.controls['lastName']?.touched" class="invalid-feedback">
        Please enter your last name.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required />
      <div *ngIf="registerForm.controls['email']?.invalid && registerForm.controls['email']?.touched" class="invalid-feedback">
        Please enter a valid email address.
      </div>
    </div>

    <div class="form-group">
      <label for="mobileNumber">Mobile Number</label>
      <input type="tel" id="mobileNumber" class="input-phone" [(ngModel)]="user.mobileNumber" name="mobileNumber" required />
      <div *ngIf="registerForm.controls['mobileNumber']?.invalid && registerForm.controls['mobileNumber']?.touched" class="invalid-feedback">
        Please enter a valid mobile number.
      </div>
    </div>

    <div class="form-group">
      <label for="dateOfBirth">Date of Birth</label>
      <input type="date" id="dateOfBirth" class="input-date" [(ngModel)]="user.dateOfBirth" name="dateOfBirth" required />
      <div *ngIf="registerForm.controls['dateOfBirth']?.invalid && registerForm.controls['dateOfBirth']?.touched" class="invalid-feedback">
        Please select your date of birth.
      </div>
    </div>

    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" class="select-control" [(ngModel)]="user.gender" name="gender" required>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <div *ngIf="registerForm.controls['gender']?.invalid && registerForm.controls['gender']?.touched" class="invalid-feedback">
        Please select your gender.
      </div>
    </div>

    <div class="form-group">
      <label for="userPassword">Password</label>
      <input type="password" id="userPassword" class="form-control" [(ngModel)]="user.userPassword" name="userPassword" required />
      <div *ngIf="registerForm.controls['userPassword']?.invalid && registerForm.controls['userPassword']?.touched" class="invalid-feedback">
        Please enter a password.
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="user.confirmPassword" name="confirmPassword" required />
      <div *ngIf="user.userPassword && user.confirmPassword && user.userPassword !== user.confirmPassword" class="invalid-feedback">
        Passwords do not match.
      </div>
    </div>
    
    <button type="submit" class="btn" [disabled]="registerForm.invalid || user.userPassword !== user.confirmPassword">Register</button>
    
  </form>
</div>
