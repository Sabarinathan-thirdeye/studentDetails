<div class="register-container">
    <h2>Add Student</h2>
    <form [formGroup]="addStudentForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" formControlName="firstName" />
            <div *ngIf="addStudentForm.get('firstName')?.invalid && addStudentForm.get('firstName')?.touched">
                <small>First name is required.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" formControlName="lastName" />
            <div *ngIf="addStudentForm.get('lastName')?.invalid && addStudentForm.get('lastName')?.touched">
                <small>Last name is required.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" formControlName="email" />
            <div *ngIf="addStudentForm.get('email')?.invalid && addStudentForm.get('email')?.touched">
                <small *ngIf="addStudentForm.get('email')?.errors?.['required']">Email is required.</small>
                <small *ngIf="addStudentForm.get('email')?.errors?.['email']">Invalid email format.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" formControlName="gender">
                <option value="" disabled>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <div *ngIf="addStudentForm.get('gender')?.invalid && addStudentForm.get('gender')?.touched">
                <small>Gender is required.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="mobileNumber">Mobile Number:</label>
            <input type="text" id="mobileNumber" formControlName="mobileNumber" />
            <div *ngIf="addStudentForm.get('mobileNumber')?.invalid && addStudentForm.get('mobileNumber')?.touched">
                <small *ngIf="addStudentForm.get('mobileNumber')?.errors?.['required']">Mobile number is required.</small>
                <small *ngIf="addStudentForm.get('mobileNumber')?.errors?.['pattern']">Enter a valid 10-digit number.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="dateOfBirth">Date of Birth:</label>
            <input type="date" id="dateOfBirth" formControlName="dateOfBirth" />
            <div *ngIf="addStudentForm.get('dateOfBirth')?.invalid && addStudentForm.get('dateOfBirth')?.touched">
                <small>Date of birth is required.</small>
            </div>
        </div>

        <button type="submit" [disabled]="addStudentForm.invalid" class="register-btn">Add Student</button>
    </form>
</div>
