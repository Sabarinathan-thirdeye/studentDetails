<div class="login-container">
  <form (ngSubmit)="onSubmit()" #loginform="ngForm">
    <div class="signinup">
      <h2 class="signin signup">Login</h2>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        class="form-control"
        required
        placeholder="Enter your email"
        #emailField="ngModel"
      />
      <div *ngIf="emailField.invalid && (emailField.touched || loginform.submitted)" class="text-danger small">
        Email is required.
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password <span class="required">*</span></label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        class="form-control"
        required
        placeholder="Enter your password"
        #passwordField="ngModel"
      />
      <div *ngIf="passwordField.invalid && (passwordField.touched || loginform.submitted)"  class="text-danger small">
        Password is required.
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary btn-sm login-btn">Login</button>
    
  </form>
  <div class="text">
    <i class="fa-regular fa-hand-point-right"></i> Don't have an account,
    <a (click)="navigateToRegisterform()">Register here!!!</a>
  </div>
</div>
